  const ONLINE_INITIAL_HUD={hp:100,maxHp:100,xp:0,nextXp:35,level:1,kills:0,door:1,doorKills:0,doorGoal:7};

  function VoteOverlay({vote,onVote,myVote,progress}){
    // Hooks must run every render regardless of `vote`, so they're declared
    // before the early-return below (Rules of Hooks).
    const [now,setNow]=useState(Date.now());
    useEffect(()=>{
      if(!vote) return;
      const id=setInterval(()=>setNow(Date.now()),100);
      return()=>clearInterval(id);
    },[vote]);
    if(!vote) return null;
    const elapsed=(now-vote.startedAt)/1000;
    const remain=Math.max(0,vote.timeoutSeconds-elapsed);
    const pct=Math.max(0,Math.min(100,(remain/vote.timeoutSeconds)*100));
    return (
      <div className="vote-overlay">
        <div className="vote-wrap">
          <div className="upgrade-head">
            <div className="eyebrow">تصويت الفريق · {remain.toFixed(0)}s</div>
            <h2 className="upgrade-title">اختاروا الترقية</h2>
            <div className="upgrade-sub">كل الفريق ياخد نفس الكرت اللي يكسب التصويت</div>
          </div>
          <div className="vote-timerbar"><div className="vote-timerbar-fill" style={{width:`${pct}%`}}/></div>
          <div className="vote-cards">
            {vote.choices.map((choice,idx)=>{
              const count=vote.counts?(vote.counts[choice.id]||0):null;
              const mine=myVote===choice.id;
              return (
                <button key={choice.id} className={`vote-card rarity-${choice.rarity} ${mine?'voted-mine':''} ${myVote?'disabled':''}`}
                        onClick={()=>{ if(!myVote) onVote(choice.id); }}>
                  {count!==null&&<span className="vote-count-badge">{count} صوت</span>}
                  <span className="upgrade-card-top"><span className="rarity-badge">{choice.rarityLabel}</span><span className="upgrade-index">0{idx+1}</span></span>
                  <span className="upgrade-icon" aria-hidden="true"><span className="card-art-wrap"><CardArt type={choice.id} rarity={choice.rarity}/></span></span>
                  <h3>{choice.name}</h3>
                  <p>{choice.description}</p>
                  <span className="card-effect"><b>Effect</b>{choice.effect}</span>
                </button>
              );
            })}
          </div>
          <div className="vote-progress">{vote.counts?'✔ اتحسم الاختيار':(myVote?`اخترت — في انتظار باقي الفريق (${progress.votedCount}/${progress.totalCount||'?'})...`:`اضغط على كرت للتصويت (${progress.votedCount}/${progress.totalCount||'?'})`)}</div>
        </div>
      </div>
    );
  }

  function OnlineGame({socket,username,roomCode,onLeave}){
    const canvasRef=useRef(null);
    const keysRef=useRef({});
    const aimRef=useRef({x:0,y:0,active:false});
    const snapshotRef=useRef(null);
    const decorationsRef=useRef(null);
    const localFxRef=useRef({particles:[],damageNumbers:[]});
    const joystickRef=useRef(null), joystickKnobRef=useRef(null);
    const joystickTouchId=useRef(null), joystickActive=useRef(false);

    const [hud,setHud]=useState(ONLINE_INITIAL_HUD);
    const [vote,setVote]=useState(null);
    const [myVote,setMyVote]=useState(null);
    const [voteProgress,setVoteProgress]=useState({votedCount:0,totalCount:0});
    const [gameOver,setGameOver]=useState(null);
    const [toast,setToast]=useState('');
    const toastTimerRef=useRef(null);
    const announce=useCallback(msg=>{ setToast(msg); if(toastTimerRef.current)clearTimeout(toastTimerRef.current); toastTimerRef.current=setTimeout(()=>setToast(''),1800); },[]);

    if(!decorationsRef.current) decorationsRef.current=generateDecorations(WORLD_W,WORLD_H);

    useEffect(()=>{
      const onState=data=>{
        snapshotRef.current=data;
        for(const ev of (data.events||[])){
          if(ev.type==='damage') localFxRef.current.damageNumbers.push({x:ev.x,y:ev.y,amount:ev.amount,life:.55,maxLife:.55,drift:(Math.random()*16-8),isCrit:ev.crit});
          else if(ev.type==='kill') addLocalBurst(localFxRef.current,ev.x,ev.y,ev.boss?'#f77961':'#e8d9b8',ev.boss?8:4);
          else if(ev.type==='hurt') addLocalBurst(localFxRef.current,ev.x,ev.y,'#f06c5c',4);
          else if(ev.type==='dodge') addLocalBurst(localFxRef.current,ev.x,ev.y,'#8fb7f0',3);
          else if(ev.type==='chest') addLocalBurst(localFxRef.current,ev.x,ev.y,'#f2c94c',7);
          else if(ev.type==='lightning') addLocalBurst(localFxRef.current,ev.x,ev.y,'#aaccff',12);
          else if(ev.type==='announce') announce(ev.message);
        }
      };
      const onVoteStart=data=>{ setVote({choices:data.choices,timeoutSeconds:data.timeoutSeconds,startedAt:Date.now(),counts:null}); setMyVote(null); setVoteProgress({votedCount:0,totalCount:0}); };
      const onVoteProgress=data=>setVoteProgress(data);
      const onVoteResult=data=>{ setVote(v=>v?{...v,counts:data.counts}:v); setTimeout(()=>{setVote(null);setMyVote(null);},1400); };
      const onGameOver=data=>setGameOver(data);
      socket.on('game:state',onState);
      socket.on('game:vote:start',onVoteStart);
      socket.on('game:vote:progress',onVoteProgress);
      socket.on('game:vote:result',onVoteResult);
      socket.on('game:over',onGameOver);
      return ()=>{
        socket.off('game:state',onState);
        socket.off('game:vote:start',onVoteStart);
        socket.off('game:vote:progress',onVoteProgress);
        socket.off('game:vote:result',onVoteResult);
        socket.off('game:over',onGameOver);
      };
    },[socket,announce]);

    useEffect(()=>{
      const down=e=>{ const code=e.code; const control=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight']; if(control.includes(code))e.preventDefault(); let key=''; if(code==='KeyW')key='w'; else if(code==='KeyA')key='a'; else if(code==='KeyS')key='s'; else if(code==='KeyD')key='d'; else key=e.key.toLowerCase(); keysRef.current[key]=true; };
      const up=e=>{ const code=e.code; let key=''; if(code==='KeyW')key='w'; else if(code==='KeyA')key='a'; else if(code==='KeyS')key='s'; else if(code==='KeyD')key='d'; else key=e.key.toLowerCase(); keysRef.current[key]=false; };
      const releaseAll=()=>{keysRef.current={};};
      window.addEventListener('keydown',down); window.addEventListener('keyup',up); window.addEventListener('blur',releaseAll); document.addEventListener('visibilitychange',releaseAll);
      return()=>{ window.removeEventListener('keydown',down); window.removeEventListener('keyup',up); window.removeEventListener('blur',releaseAll); document.removeEventListener('visibilitychange',releaseAll); };
    },[]);

    const handleJoystickStart=useCallback(e=>{
      e.preventDefault(); const touch=e.touches?e.touches[0]:e; if(!touch)return;
      joystickTouchId.current=touch.identifier; joystickActive.current=true;
      const rect=joystickRef.current.getBoundingClientRect();
      const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2, maxR=rect.width/2-10;
      const dx=touch.clientX-cx, dy=touch.clientY-cy, dist=Math.hypot(dx,dy), clamped=Math.min(dist,maxR), angle=Math.atan2(dy,dx);
      joystickKnobRef.current.style.transform=`translate(calc(-50% + ${clamped*Math.cos(angle)}px), calc(-50% + ${clamped*Math.sin(angle)}px))`;
      const norm=dist>0?Math.min(1,dist/maxR):0;
      const v={x:(dx/dist)*norm,y:(dy/dist)*norm};
      keysRef.current['w']=v.y<-0.3; keysRef.current['s']=v.y>0.3; keysRef.current['a']=v.x<-0.3; keysRef.current['d']=v.x>0.3;
    },[]);
    const handleJoystickMove=useCallback(e=>{
      e.preventDefault(); if(!joystickActive.current)return;
      let touch=null;
      if(e.touches){ for(const t of e.touches){ if(t.identifier===joystickTouchId.current){touch=t;break;} } if(!touch)return; }
      else touch=e;
      const rect=joystickRef.current.getBoundingClientRect();
      const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2, maxR=rect.width/2-10;
      const dx=touch.clientX-cx, dy=touch.clientY-cy, dist=Math.hypot(dx,dy), clamped=Math.min(dist,maxR), angle=Math.atan2(dy,dx);
      joystickKnobRef.current.style.transform=`translate(calc(-50% + ${clamped*Math.cos(angle)}px), calc(-50% + ${clamped*Math.sin(angle)}px))`;
      const norm=dist>0?Math.min(1,dist/maxR):0;
      const v={x:(dx/dist)*norm,y:(dy/dist)*norm};
      keysRef.current['w']=v.y<-0.3; keysRef.current['s']=v.y>0.3; keysRef.current['a']=v.x<-0.3; keysRef.current['d']=v.x>0.3;
    },[]);
    const handleJoystickEnd=useCallback(e=>{
      e.preventDefault(); joystickActive.current=false; joystickTouchId.current=null;
      if(joystickKnobRef.current) joystickKnobRef.current.style.transform='translate(-50%, -50%)';
      keysRef.current['w']=false; keysRef.current['s']=false; keysRef.current['a']=false; keysRef.current['d']=false;
    },[]);

    const onPointerMove=useCallback(e=>{
      const canvas=canvasRef.current, data=snapshotRef.current; if(!canvas||!data)return;
      const me=data.players.find(p=>p.id===username); if(!me)return;
      const rect=canvas.getBoundingClientRect();
      const sx=e.clientX-rect.left, sy=e.clientY-rect.top, cssW=rect.width, cssH=rect.height;
      const baseZoom=.7, viewFactor=Math.min(2,me.viewDist/DEFAULT_VIEW_DIST), zoomFactor=baseZoom*viewFactor;
      const viewW=cssW*zoomFactor, viewH=cssH*zoomFactor;
      let camX=me.x-viewW/2, camY=me.y-viewH/2;
      camX=Math.max(0,Math.min(WORLD_W-viewW,camX)); camY=Math.max(0,Math.min(WORLD_H-viewH,camY));
      aimRef.current.x=camX+(sx-cssW/2)*zoomFactor+viewW/2;
      aimRef.current.y=camY+(sy-cssH/2)*zoomFactor+viewH/2;
      aimRef.current.active=true;
    },[username]);

    useEffect(()=>{
      const canvas=canvasRef.current, ctx=canvas?.getContext('2d',{alpha:false});
      if(!canvas||!ctx)return;
      let anim=0, lastCanvasWidth=0, lastCanvasHeight=0, lastCanvasRatio=0, lastInputSent=0, lastHudAt=0;
      const resize=()=>{ const rect=canvas.getBoundingClientRect(); const ratio=Math.min(window.devicePixelRatio||1,1.25); const w=Math.max(400,Math.floor(rect.width)); const h=Math.max(300,Math.floor(rect.height)); if(w!==lastCanvasWidth||h!==lastCanvasHeight||ratio!==lastCanvasRatio){ canvas.width=Math.floor(w*ratio); canvas.height=Math.floor(h*ratio); lastCanvasWidth=w; lastCanvasHeight=h; lastCanvasRatio=ratio; } ctx.setTransform(ratio,0,0,ratio,0,0); ctx.imageSmoothingEnabled=false; };

      const loop=time=>{
        resize();
        const data=snapshotRef.current;
        const h=(keysRef.current.d?1:0)-(keysRef.current.a?1:0);
        const v=(keysRef.current.s?1:0)-(keysRef.current.w?1:0);
        if(time-lastInputSent>45){
          lastInputSent=time;
          socket.emit('game:input',{h,v,aiming:aimRef.current.active,aimX:aimRef.current.x,aimY:aimRef.current.y});
        }
        if(data){
          const me=data.players.find(p=>p.id===username);
          if(me&&time-lastHudAt>110){
            lastHudAt=time;
            setHud({hp:Math.max(0,me.hp),maxHp:me.maxHp,xp:data.teamXp,nextXp:data.teamNextXp,level:data.teamLevel,kills:data.kills,door:data.door,doorKills:data.doorKills,doorGoal:data.doorGoal});
          }
          drawOnlineFrame(ctx,canvas,data,username,decorationsRef.current,localFxRef.current,lastCanvasRatio);
        }
        // decay local cosmetic fx every frame regardless of snapshot arrival
        stepLocalFx(localFxRef.current,1/60);
        anim=requestAnimationFrame(loop);
      };
      resize(); anim=requestAnimationFrame(loop);
      return()=>cancelAnimationFrame(anim);
    },[socket,username]);

    const isHost=false; // host-only actions (restart) are exposed via the lobby that re-mounts after game:over
    const onVote=useCallback(cardId=>{ setMyVote(cardId); socket.emit('game:vote',{cardId}); },[socket]);

    return (
      <div className="game-shell">
        <header className="game-header">
          <div className="brand"><div className="brand-mark"/><div className="brand-copy"><div className="brand-name">Block Survivor</div><div className="brand-sub">Online · Room {roomCode}</div></div></div>
        </header>
        <main className="game-main">
          <div className="game-grid">
            <section className="arena-wrap">
              <div className="arena-frame">
                <canvas ref={canvasRef} className="game-canvas" width="1400" height="900" onPointerMove={onPointerMove} onPointerLeave={()=>{aimRef.current.active=false;}}/>
                <div className="arena-reticle"/>
                <div className="hud-overlay">
                  <div className="hud-top">
                    <div className="hud-left"></div>
                    <div className="hud-right">
                      <div className="hud-bar-label"><span>❤️ Health</span><span>{Math.ceil(hud.hp)} / {hud.maxHp}</span></div>
                      <div className="hud-bar"><div className="hud-bar-fill hp" style={{width:`${Math.max(0,Math.min(100,hud.hp/hud.maxHp*100))}%`}}/></div>
                      <div className="hud-bar-label" style={{marginTop:'2px'}}><span>⭐ Team XP</span><span>{hud.xp} / {hud.nextXp}</span></div>
                      <div className="hud-bar"><div className="hud-bar-fill xp" style={{width:`${Math.min(100,hud.xp/hud.nextXp*100)}%`}}/><span className="xp-level-badge">Lv.{hud.level}</span></div>
                    </div>
                  </div>
                  <div className="hud-center"><div className="door-info">🚪 Door {hud.door}</div></div>
                </div>
              </div>
              <div className="arena-caption"><span><strong>Controls:</strong> WASD · Auto-attack</span><span><strong>Team:</strong> {roomCode}</span></div>
            </section>
          </div>
        </main>
        <div className="mobile-controls">
          <div className="joystick-area" ref={joystickRef}
               onTouchStart={handleJoystickStart} onTouchMove={handleJoystickMove} onTouchEnd={handleJoystickEnd} onTouchCancel={handleJoystickEnd}
               onMouseDown={handleJoystickStart} onMouseMove={handleJoystickMove} onMouseUp={handleJoystickEnd} onMouseLeave={handleJoystickEnd}>
            <div className="joystick-knob" ref={joystickKnobRef}></div>
          </div>
        </div>
        <VoteOverlay vote={vote} myVote={myVote} onVote={onVote} progress={voteProgress}/>
        {gameOver&&(
          <div className="screen-overlay">
            <section className="title-card game-over-card">
              <div className="eyebrow">Game Over</div>
              <h2 className="game-over-title">وقع الفريق</h2>
              <p className="hero-copy">حاولوا تاني ببناء مختلف.</p>
              <div className="run-summary">
                <div><span>Last Door</span><strong>{gameOver.door}</strong></div>
                <div><span>Kills</span><strong>{gameOver.kills}</strong></div>
                <div><span>Level</span><strong>{gameOver.level}</strong></div>
              </div>
              <button className="restart-button" onClick={onLeave}>رجوع للوبي</button>
            </section>
          </div>
        )}
        {toast&&<div className="toast" role="status">{toast}</div>}
      </div>
    );
  }

  function addLocalBurst(fx,x,y,color,count){
    count=count||5;
    for(let i=0;i<count;i++){
      const angle=(Math.PI*2*i)/count+Math.random()*.35;
      fx.particles.push({x,y,vx:Math.cos(angle)*randomBetween(25,75),vy:Math.sin(angle)*randomBetween(25,75),life:randomBetween(.18,.42),maxLife:.42,color,size:randomBetween(2,5)});
    }
  }
  function stepLocalFx(fx,delta){
    for(let i=fx.particles.length-1;i>=0;i--){ const pt=fx.particles[i]; pt.x+=pt.vx*delta; pt.y+=pt.vy*delta; pt.vx*=.94; pt.vy*=.94; pt.life-=delta; if(pt.life<=0)fx.particles.splice(i,1); }
    for(let i=fx.damageNumbers.length-1;i>=0;i--){ const dn=fx.damageNumbers[i]; dn.life-=delta; dn.y-=26*delta; dn.x+=dn.drift*delta; if(dn.life<=0)fx.damageNumbers.splice(i,1); }
  }

  // Renders one frame of the online arena from a server snapshot.
  function drawOnlineFrame(ctx,canvas,data,username,decorations,fx,ratio){
    const canvasW=canvas.width/ratio||canvas.clientWidth, canvasH=canvas.height/ratio||canvas.clientHeight;
    const me=data.players.find(p=>p.id===username)||data.players[0];
    if(!me){ ctx.clearRect(0,0,canvasW,canvasH); return; }
    const baseZoom=0.7, viewFactor=Math.min(2,me.viewDist/DEFAULT_VIEW_DIST), zoomFactor=baseZoom*viewFactor;
    const viewW=canvasW*zoomFactor, viewH=canvasH*zoomFactor;
    let camX=me.x-viewW/2, camY=me.y-viewH/2;
    camX=Math.max(0,Math.min(WORLD_W-viewW,camX)); camY=Math.max(0,Math.min(WORLD_H-viewH,camY));

    ctx.clearRect(0,0,canvasW,canvasH);
    ctx.save();
    ctx.translate(canvasW/2,canvasH/2);
    ctx.scale(1/zoomFactor,1/zoomFactor);
    ctx.translate(-viewW/2,-viewH/2);

    drawGround(ctx,{decorations},camX,camY,viewW,viewH);
    const drawWorld=fn=>{ ctx.save(); ctx.translate(-camX,-camY); fn(); ctx.restore(); };

    drawWorld(()=>{
      for(const shard of (data.shards||[])){
        ctx.save(); ctx.translate(Math.round(shard.x),Math.round(shard.y));
        ctx.shadowColor='#f1c40f'; ctx.shadowBlur=8;
        ctx.beginPath(); ctx.moveTo(0,-6); ctx.lineTo(5,0); ctx.lineTo(0,6); ctx.lineTo(-5,0); ctx.closePath();
        ctx.fillStyle='#f7dc6f'; ctx.fill(); ctx.restore();
      }
      for(const chest of (data.chests||[])){
        if(chest.opened) continue;
        ctx.save(); ctx.translate(chest.x,chest.y);
        ctx.fillStyle='#8b5a36'; ctx.fillRect(-11,-8,22,16);
        ctx.fillStyle='#f2c94c'; ctx.fillRect(-11,-10,22,5);
        ctx.restore();
      }
      for(const enemy of (data.enemies||[])) drawEnemy(ctx,enemy,data.elapsed);
      for(const proj of (data.projectiles||[])){
        ctx.save(); ctx.translate(proj.x,proj.y); ctx.rotate(Math.atan2(proj.vy,proj.vx));
        ctx.fillStyle=proj.crit?'#ffd76b':'#f2c94c';
        ctx.beginPath(); ctx.moveTo(proj.size*1.6,0); ctx.lineTo(-proj.size,proj.size*0.6); ctx.lineTo(-proj.size,-proj.size*0.6); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      for(const proj of (data.enemyProjectiles||[])){
        ctx.save(); ctx.translate(proj.x,proj.y);
        ctx.fillStyle=proj.color||'#e05c4f';
        ctx.beginPath(); ctx.arc(0,0,proj.size,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
      for(const p of data.players){
        if(!p.connected) continue;
        ctx.globalAlpha=p.alive?1:0.25;
        drawPlayer(ctx,p.x,p.y,p.facing,p.walkCycle,p.attackKick,p.aimAngle,p.scarfAngle,1.3,p.range);
        if(p.id!==username){
          ctx.save(); ctx.font='700 11px "Space Mono", monospace'; ctx.textAlign='center'; ctx.fillStyle='#dfe5f4'; ctx.shadowColor='#000'; ctx.shadowBlur=6;
          ctx.fillText(p.name,p.x,p.y-30); ctx.restore();
        }
        ctx.globalAlpha=1;
        if(p.orbit>0){
          for(let k=0;k<p.orbit;k++){ const angle=data.elapsed*2.8+(Math.PI*2*k)/p.orbit; const ox=p.x+Math.cos(angle)*32, oy=p.y+Math.sin(angle)*32; ctx.save(); ctx.translate(ox,oy); ctx.fillStyle='#66ffbb'; ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill(); ctx.restore(); }
        }
      }
      for(const pt of fx.particles){
        ctx.save(); ctx.globalAlpha=Math.max(0,pt.life/pt.maxLife); ctx.fillStyle=pt.color;
        ctx.fillRect(pt.x-pt.size/2,pt.y-pt.size/2,pt.size,pt.size); ctx.restore();
      }
      for(const dn of fx.damageNumbers){
        ctx.save(); ctx.globalAlpha=Math.max(0,dn.life/dn.maxLife);
        ctx.font=dn.isCrit?'700 15px "Space Mono", monospace':'700 12px "Space Mono", monospace';
        ctx.fillStyle=dn.isCrit?'#ffd76b':'#fff'; ctx.textAlign='center';
        ctx.fillText(Math.round(dn.amount),dn.x,dn.y); ctx.restore();
      }
    });

    drawBossWarnings(ctx,{bossWarnings:data.bossWarnings||[]},camX,camY,viewW,viewH);
    ctx.restore();
  }

  // ---------------- Online app shell (login → home → lobby → game) ----------------
  function OnlineApp({onExit}){
    const socketRef=useRef(null);
    const [serverUrl,setServerUrl]=useState(defaultServerUrl());
    const [screen,setScreen]=useState('login'); // login | home | lobby | game
    const [username,setUsername]=useState(null);
    const [authError,setAuthError]=useState('');
    const [authBusy,setAuthBusy]=useState(false);
    const [friends,setFriends]=useState({friends:[],incoming:[],outgoing:[]});
    const [room,setRoom]=useState(null);
    const [joinError,setJoinError]=useState('');
    const [invites,setInvites]=useState([]);

    const persistServerUrl=useCallback(url=>{ setServerUrl(url); try{localStorage.setItem('bs_server_url',url);}catch(e){} },[]);

    const doAuth=useCallback((name)=>{
      setAuthBusy(true); setAuthError('');
      let socket=socketRef.current;
      if(!socket||socket.io.uri!==serverUrl){
        if(socket) socket.disconnect();
        socket=io(serverUrl,{transports:['websocket','polling']});
        window.gameSocket=socket;
        socketRef.current=socket;
        socket.on('connect_error',()=>{ setAuthBusy(false); setAuthError('مش قادر يوصل للسيرفر — تأكد من رابط السيرفر'); });
        socket.on('friend:list',data=>setFriends(data));
        socket.on('friend:request',()=>{});
        socket.on('room:update',data=>{
          setRoom(data);
          if(data.status==='lobby') setScreen(s=>s==='login'?s:'lobby');
          else if(data.status==='playing') setScreen('game');
        });
        socket.on('room:invited',data=>setInvites(list=>[...list,data]));
        socket.on('auth:kicked',()=>{ setScreen('login'); setUsername(null); setAuthError('تم تسجيل الدخول من جهاز تاني بنفس الاسم'); });
        socket.on('error',data=>setJoinError(data.message||''));
      }
      let token=null;
      try{ if(localStorage.getItem('bs_username')===name) token=localStorage.getItem('bs_token'); }catch(e){}
      socket.emit('auth',{username:name,token},res=>{
        setAuthBusy(false);
        if(!res||!res.ok){ setAuthError((res&&res.error)||'حصل خطأ'); return; }
        setUsername(res.username);
        try{ localStorage.setItem('bs_username',res.username); localStorage.setItem('bs_token',res.token); }catch(e){}
        setScreen('home');
      });
    },[serverUrl]);

    // auto-login if we have saved credentials
    useEffect(()=>{
      let saved=null;
      try{ saved=localStorage.getItem('bs_username'); }catch(e){}
      if(saved) doAuth(saved);
      return ()=>{ if(socketRef.current) socketRef.current.disconnect(); };
      // eslint-disable-next-line
    },[]);

    const friendActions={
      onAdd:target=>socketRef.current.emit('friend:add',{target}),
      onAccept:from=>socketRef.current.emit('friend:accept',{from}),
      onDecline:from=>socketRef.current.emit('friend:decline',{from}),
      onRemove:target=>socketRef.current.emit('friend:remove',{target}),
      onInvite:(target,roomCode)=>socketRef.current.emit('room:invite',{target,roomCode}),
    };

    const onCreate=useCallback(teamSizeMax=>{
      setJoinError('');
      socketRef.current.emit('room:create',{teamSizeMax},res=>{ if(!res||!res.ok) setJoinError('تعذر إنشاء الفريق'); });
    },[]);
    const onJoin=useCallback(code=>{
      setJoinError('');
      if(!code||code.length<3){ setJoinError('اكتب كود صحيح'); return; }
      socketRef.current.emit('room:join',{roomCode:code},res=>{ if(!res||!res.ok) setJoinError((res&&res.error)||'تعذر الدخول'); });
    },[]);
    const onReady=useCallback(ready=>{ socketRef.current.emit('room:ready',{ready}); },[]);
    const onStart=useCallback(()=>{ if(room) socketRef.current.emit('room:start',{roomCode:room.roomCode}); },[room]);
    const onLeaveRoom=useCallback(()=>{ socketRef.current.emit('room:leave'); setRoom(null); setScreen('home'); },[]);
    const onLeaveGameToLobby=useCallback(()=>{
      if(room&&room.hostUsername===username) socketRef.current.emit('room:restart',{roomCode:room.roomCode});
      setScreen('lobby');
    },[room,username]);

    const acceptInvite=useCallback(inv=>{ setInvites(list=>list.filter(i=>i!==inv)); onJoin(inv.roomCode); },[onJoin]);
    const dismissInvite=useCallback(inv=>setInvites(list=>list.filter(i=>i!==inv)),[]);

    return (
      <>
        {screen==='login'&&<LoginScreen onLogin={doAuth} error={authError} busy={authBusy} serverUrl={serverUrl} onServerUrlChange={persistServerUrl} onBack={onExit}/>}
        {screen==='home'&&<HomeScreen username={username} friends={friends} friendActions={friendActions} onCreate={onCreate} onJoin={onJoin} joinError={joinError}/>}
        {screen==='lobby'&&<LobbyScreen room={room} username={username} onReady={onReady} onStart={onStart} onLeave={onLeaveRoom} onInvite={friendActions.onInvite} friends={friends} friendActions={friendActions}/>}
        {screen==='game'&&room&&<OnlineGame socket={socketRef.current} username={username} roomCode={room.roomCode} onLeave={onLeaveGameToLobby}/>}
        <div className="toast-stack">
          {invites.map((inv,idx)=>(
            <div className="invite-toast" key={idx}>
              <span>📩 {inv.from} دعاك لفريق ({inv.currentSize}/{inv.teamSizeMax})</span>
              <button className="join-btn" onClick={()=>acceptInvite(inv)}>انضم</button>
              <button className="dismiss-btn" onClick={()=>dismissInvite(inv)}>تجاهل</button>
            </div>
          ))}
        </div>
      </>
    );
  }

  function App(){
    const [screen,setScreen]=useState('menu'); // menu | solo | online
    if(screen==='solo') return <SoloGame onExit={()=>setScreen('menu')}/>;
    if(screen==='online') return <OnlineApp onExit={()=>setScreen('menu')}/>;
    return <MainMenu onSolo={()=>setScreen('solo')} onOnline={()=>setScreen('online')}/>;
  }

  ReactDOM.render(<App/>,document.getElementById('root'));
})();
</script>
</body>
</html>
