<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
  <title>Block Survivor - Balanced</title>
  <script crossorigin src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
    :root {
      --background: 225 35% 7%;
      --foreground: 45 40% 92%;
      --border: 225 22% 19%;
      --card: 225 31% 11%;
      --primary: 47 94% 63%;
      --secondary: 174 43% 44%;
      --accent: 13 83% 61%;
      --app-font-sans: 'Changa', sans-serif;
      --app-font-mono: 'Space Mono', monospace;
      --shadow-sm: 0 8px 20px rgba(3,5,15,.25);
    }
    * { box-sizing: border-box; user-select: none; -webkit-touch-callout: none; }
    html, body, #root { min-height:100%; margin:0; height:100%; }
    body {
      background:hsl(var(--background));
      color:hsl(var(--foreground));
      font-family:var(--app-font-sans);
      overflow:hidden;
      touch-action: none;
    }
    button { font:inherit; }
    .game-shell {
      min-height:100vh;
      background:
        radial-gradient(circle at 50% -10%, rgba(37,57,94,.28), transparent 43%),
        linear-gradient(155deg,#0a0d1d 0%,#11162b 57%,#0b1020 100%);
      position:relative;
      overflow:hidden;
    }
    .game-shell::before {
      content:'';
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.035;
      background-image:radial-gradient(rgba(255,255,255,.4) .6px,transparent .6px);
      background-size:4px 4px;
      z-index:20;
    }
    .game-header {
      height:72px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 clamp(16px,4vw,58px);
      position:relative;
      z-index:10;
      border-bottom:1px solid rgba(127,139,190,.15);
      background:rgba(9,12,28,.72);
      backdrop-filter:blur(14px);
    }
    .brand { display:flex; align-items:center; gap:12px; color:#f7e8b0; }
    .brand-mark {
      width:34px;height:34px;border:3px solid #f2c94c;background:#18203a;
      box-shadow:5px 5px 0 #0a0e1c,inset -6px -6px 0 #11172a;
      transform:rotate(3deg);position:relative;
    }
    .brand-mark::after {
      content:'';width:8px;height:8px;background:#f77961;position:absolute;left:7px;top:7px;
      box-shadow:10px 9px 0 #65c3a9;
    }
    .brand-copy{line-height:1}
    .brand-name{font-size:22px;font-weight:700}
    .brand-sub{color:#7983a6;font-size:11px;margin-top:4px;letter-spacing:.13em}
    .game-main{
      width:min(1380px,100%);
      margin:0 auto;
      padding:clamp(18px,3vw,38px) clamp(14px,4vw,58px) 44px;
      position:relative;z-index:1;
    }
    .game-grid{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
    .arena-wrap{min-width:0;position:relative;width:100%}
    .arena-frame{
      position:relative;background:#121a30;border:1px solid #35405f;
      box-shadow:0 0 0 5px rgba(12,16,35,.8),0 25px 70px rgba(0,0,0,.38);
      overflow:hidden;width:100%;
    }
    .arena-frame::before,.arena-frame::after{
      content:'';pointer-events:none;position:absolute;z-index:3;width:18px;height:18px;border-color:#e6be4b;
    }
    .arena-frame::before{left:-1px;top:-1px;border-left:3px solid;border-top:3px solid}
    .arena-frame::after{right:-1px;bottom:-1px;border-right:3px solid;border-bottom:3px solid}
    .game-canvas{
      width:100%;display:block;cursor:crosshair;background:#0a1225;
      aspect-ratio:16 / 9;max-height:85vh;
      image-rendering:pixelated;
      touch-action: none;
    }
    .arena-reticle{position:absolute;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 80px rgba(3,5,14,.25)}
    .arena-caption{display:flex;justify-content:space-between;align-items:center;color:#7e89a8;font-size:12px;padding:10px 2px 0}
    .arena-caption strong{color:#d5ddf2;font-weight:500}

    .hud-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;
    }
    .hud-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .hud-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      min-width: 180px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      border-radius: 10px;
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .pause-button {
      border: 1px solid #4d5d81;
      background: rgba(13,19,38,.83);
      color:#c8d2eb;
      padding:4px 10px;
      cursor:pointer;
      font-size:11px;
      border-radius: 8px;
      pointer-events: auto;
      backdrop-filter: blur(4px);
      transition: background 0.2s;
      font-family: var(--app-font-sans);
    }
    .pause-button:hover {
      background: rgba(30,40,70,0.9);
    }
    .hud-bar {
      width: 100%;
      height: 10px;
      background: rgba(0,0,0,0.5);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      position: relative;
    }
    .hud-bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.15s ease;
    }
    .hud-bar-fill.hp { background: #ed6d5a; }
    .hud-bar-fill.xp {
      background: linear-gradient(90deg, #f1c40f, #e67e22);
      position: relative;
    }
    .hud-bar-fill.xp::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: xp-wave 1.5s infinite linear;
      transform: translateX(-100%);
    }
    @keyframes xp-wave {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .hud-bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #bcc3d9;
      font-family: var(--app-font-mono);
      width: 100%;
      margin-bottom: 2px;
    }
    .xp-level-badge {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 8px;
      font-family: var(--app-font-mono);
      font-weight: 700;
      color: rgba(255,255,255,0.95);
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
      pointer-events: none;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }
    .hud-center {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      border-radius: 12px;
      padding: 6px 18px;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
      pointer-events: none;
    }
    .hud-center .door-info {
      font-size: 16px;
      font-weight: 700;
      color: #f2c94c;
      font-family: var(--app-font-mono);
      letter-spacing: 0.5px;
    }
    .pause-pill {
      position:absolute;
      z-index:5;
      top:13px;
      left:50%;
      transform:translateX(-50%);
      color:#dbe2f1;
      background:rgba(9,14,28,.8);
      border:1px solid #566487;
      padding:5px 11px;
      font-size:12px;
      border-radius: 20px;
      pointer-events: none;
    }

    .toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);z-index:50;background:#f2c94c;color:#141a2b;padding:8px 16px;font-size:13px;box-shadow:4px 4px 0 rgba(0,0,0,.33);border-radius:10px;font-family:var(--app-font-sans);}

    .mobile-controls {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      z-index: 15;
      pointer-events: none;
      touch-action: none;
    }
    @media (pointer: coarse) {
      .mobile-controls { display: block; }
    }
    .joystick-area {
      position: absolute;
      bottom: 0;
      left: 20px;
      width: 120px;
      height: 120px;
      pointer-events: auto;
      touch-action: none;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15);
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }
    .joystick-knob {
      position: absolute;
      width: 50px;
      height: 50px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 40% 35%, #f2c94c, #b3861a);
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      pointer-events: none;
      transition: none;
      will-change: transform;
    }
    @media (min-width: 768px) and (max-width: 1024px) and (pointer: coarse) {
      .joystick-area { width: 150px; height: 150px; left: 30px; bottom: 30px; }
      .joystick-knob { width: 60px; height: 60px; }
    }
    @media (max-width: 450px) and (pointer: coarse) {
      .joystick-area { width: 100px; height: 100px; left: 10px; bottom: 10px; }
    }

    .screen-overlay{
      position:fixed;z-index:30;inset:0;display:grid;place-items:center;padding:18px;
      background:rgba(5,8,19,.76);backdrop-filter:blur(7px);animation:fade-in .2s ease both;
    }
    .title-card{
      width:min(760px,100%);padding:clamp(30px,7vw,68px);background:#121a31;
      border:1px solid #465276;box-shadow:0 25px 100px rgba(0,0,0,.5),9px 9px 0 #0a0e1d;
      text-align:center;position:relative;overflow:hidden;
    }
    .title-card::before{
      content:'';position:absolute;width:320px;height:320px;right:-120px;top:-150px;
      border:1px solid rgba(242,201,76,.25);transform:rotate(45deg);
      box-shadow:0 0 0 18px rgba(242,201,76,.05),0 0 0 36px rgba(242,201,76,.04)
    }
    .eyebrow{color:#65c3a9;letter-spacing:.22em;font:700 11px var(--app-font-mono)}
    .hero-title{color:#f7e8b0;font-size:clamp(55px,11vw,104px);line-height:.94;margin:18px 0 11px;font-weight:700;letter-spacing:-.045em;text-shadow:5px 5px 0 #293454}
    .hero-title span{color:#f77961}
    .hero-copy{max-width:480px;margin:0 auto;color:#9da9c7;font-size:17px;line-height:1.8}
    .start-button,.restart-button,.choose-button{border:0;cursor:pointer;transition:transform .14s ease,filter .14s ease;font-family:var(--app-font-sans);}
    .start-button{margin-top:32px;color:#11172a;background:#f2c94c;padding:14px 31px;font-weight:700;font-size:17px;box-shadow:5px 5px 0 #a98628;border-radius:10px}
    .start-button:hover,.restart-button:hover,.upgrade-card:hover{transform:translate(-2px,-2px);filter:brightness(1.05)}
    .start-button:active,.restart-button:active,.upgrade-card:active{transform:translate(1px,1px)}
    .control-legend{display:flex;justify-content:center;flex-wrap:wrap;gap:17px;margin-top:32px;color:#7885a8;font-size:12px}
    .keycap{display:inline-block;color:#e1e7f4;border:1px solid #465376;background:#1c2948;padding:2px 5px;font:11px var(--app-font-mono);margin:0 3px;border-radius:4px}
    .game-over-card{width:min(480px,100%);padding:40px 32px;text-align:center;border-color:#674955}
    .game-over-card .eyebrow{color:#f77961}
    .game-over-title{color:#f3ddd0;font-size:44px;margin:13px 0 4px}
    .run-summary{display:flex;justify-content:center;gap:30px;margin:24px 0;color:#8290b2;font-size:12px}
    .run-summary strong{display:block;color:#f6edcf;font:700 19px var(--app-font-mono);margin-top:3px}
    .restart-button{padding:12px 24px;color:#10172a;background:#f2c94c;box-shadow:4px 4px 0 #a98628;font-weight:700;border-radius:10px;font-family:var(--app-font-sans);}
    .upgrade-wrap{display:flex;flex-direction:column;align-items:center;width:min(940px,100%)}
    .upgrade-head{text-align:center;margin-bottom:25px}
    .upgrade-head .eyebrow{color:#f2c94c}
    .upgrade-title{color:#f7e8b0;font-size:clamp(29px,5vw,45px);margin:9px 0 2px}
    .upgrade-sub{color:#8794b5;font-size:14px}
    .upgrade-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;width:100%}
    .upgrade-card {
      --card-accent:#65c3a9;
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      text-align:left;
      min-height:315px;
      padding:18px 18px 16px;
      cursor:pointer;
      color:#dfe5f4;
      background:linear-gradient(145deg,#1d2a4c 0%,#10182e 72%);
      border:2px solid #455b87;
      box-shadow:0 14px 35px rgba(0,0,0,.24),7px 7px 0 #090f20;
      transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease,filter .18s ease;
      border-radius: 18px;
      font-family:var(--app-font-sans);
    }
    .upgrade-card::before{content:'';position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,transparent 0%,var(--card-accent) 18%,#fff 50%,var(--card-accent) 82%,transparent 100%); border-radius: 18px 18px 0 0;box-shadow:0 0 18px var(--card-accent);}
    .upgrade-card::after{content:'';position:absolute;inset:-45% -75%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.12) 48%,transparent 54%);transform:translateX(-45%) rotate(8deg);transition:transform .7s ease;pointer-events:none;z-index:1;}
    .upgrade-card:hover::after{transform:translateX(45%) rotate(8deg);}
    .upgrade-card:hover{border-color:color-mix(in srgb,var(--card-accent) 72%,white);box-shadow:0 0 28px color-mix(in srgb,var(--card-accent) 25%,transparent),0 17px 40px rgba(0,0,0,.32),7px 7px 0 #090f20;}
    .rarity-basic{--card-accent:#8c8c8c; background:linear-gradient(145deg,#2a2a2a 0%,#141414 72%); border-color:#6a6a6a;}
    .rarity-rare{--card-accent:#4a8bc2; background:linear-gradient(145deg,#1a2f47 0%,#0e1b2b 72%); border-color:#4a8bc2; box-shadow:0 0 20px rgba(74,139,194,0.2),0 14px 35px rgba(0,0,0,.24);}
    .rarity-epic{--card-accent:#9b59b6; background:linear-gradient(145deg,#2e1a3d 0%,#1a0d23 72%); border-color:#9b59b6; box-shadow:0 0 30px rgba(155,89,182,0.15),0 14px 35px rgba(0,0,0,.24);}
    .rarity-legendary{--card-accent:#f1c40f; background:linear-gradient(145deg,#3d3514 0%,#231f0b 72%); border-color:#f1c40f; box-shadow:0 0 40px rgba(241,196,15,0.15),0 14px 35px rgba(0,0,0,.24);}
    .rarity-mythic{--card-accent:#e74c3c; background:linear-gradient(145deg,#3d1a1a 0%,#230e0e 72%); border-color:#e74c3c; box-shadow:0 0 50px rgba(231,76,60,0.15),0 14px 35px rgba(0,0,0,.24);}
    .rarity-badge{color:var(--card-accent);border:1px solid var(--card-accent);padding:4px 8px;font:700 10px var(--app-font-mono); border-radius: 20px;}
    .upgrade-icon{color:var(--card-accent);border:1px solid var(--card-accent);border-radius:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 -12px 24px rgba(0,0,0,.22),0 0 18px color-mix(in srgb,var(--card-accent) 18%,transparent);overflow:hidden;}
    .card-art-wrap{width:100%;height:100%;display:grid;place-items:center;overflow:hidden;border-radius:12px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--card-accent) 28%,transparent),transparent 48%),linear-gradient(145deg,rgba(255,255,255,.09),rgba(0,0,0,.34));position:relative;}
    .card-art-wrap::before{content:'';position:absolute;inset:9px;border:1px solid color-mix(in srgb,var(--card-accent) 35%,transparent);border-radius:10px;transform:rotate(45deg) scale(.72);opacity:.65;}
    .card-art-wrap::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 42%,rgba(0,0,0,.25) 100%);pointer-events:none;}
    .card-art-svg{width:80px;height:80px;display:block;filter:drop-shadow(0 5px 8px rgba(0,0,0,.5));shape-rendering:geometricPrecision;overflow:visible;position:relative;z-index:1;transition:transform .18s ease,filter .18s ease;}
    .upgrade-card:hover .card-art-svg{transform:translateY(-3px) scale(1.08);filter:drop-shadow(0 8px 12px color-mix(in srgb,var(--card-accent) 38%,transparent));}
    .rarity-rare .card-art-svg{animation:art-float 2.8s ease-in-out infinite;}
    .rarity-epic .card-art-svg{animation:art-float 2.4s ease-in-out infinite,art-glow 2.2s ease-in-out infinite;}
    .rarity-legendary .card-art-svg,.rarity-mythic .card-art-svg{animation:art-float 2s ease-in-out infinite,art-glow 1.7s ease-in-out infinite;}
    .upgrade-card:focus-visible{outline:3px solid #f2c94c;outline-offset:3px;}
    .card-effect{color:var(--card-accent);}
    .rarity-legendary .upgrade-icon,.rarity-mythic .upgrade-icon{animation:card-pulse 1.8s ease-in-out infinite}
    .upgrade-card-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
    .upgrade-index { display: none; }
    .upgrade-icon{
      width:86px;height:86px;display:grid;place-items:center;border-radius:14px;background:#0a1125;font-size:45px;
      margin:23px 0 12px 0;position:relative;z-index:2;
    }
    .upgrade-type{color:#7182aa;font:700 10px var(--app-font-mono);letter-spacing:.1em;position:relative;z-index:2}
    .upgrade-card h3{color:#f7e8b0;font-size:23px;margin:5px 0 4px;position:relative;z-index:2}
    .upgrade-card p{color:#a5b1cb;font-size:13px;line-height:1.75;margin:0;min-height:48px;position:relative;z-index:2}
    .card-effect{display:flex;flex-direction:column;gap:3px;font:800 14px var(--app-font-mono);margin-top:auto;padding:12px 13px;border:1px solid rgba(255,255,255,.07);background:rgba(7,11,24,.34);position:relative;z-index:2; border-radius: 12px;}
    .card-effect b{color:#6f82ab;font-size:10px;font-weight:400}
    .choose-hint{display:block;color:#7182aa;font-size:11px;margin-top:14px}
    .choose-hint b{color:#f2c94c;font:700 15px var(--app-font-mono);margin-right:4px}

    @media(max-width:820px){
      .game-header{height:62px;padding:0 16px}
      .brand-name{font-size:18px}
      .brand-sub,.header-hint{display:none}
      .game-main{padding:15px 12px 125px}
      .game-grid{grid-template-columns:1fr}
      .upgrade-cards{grid-template-columns:1fr;max-height:76dvh;overflow-y:auto}
      .upgrade-card{min-height:200px;padding:13px 14px;border-radius: 14px;}
      .upgrade-icon{margin:12px 0 8px 0;width:60px;height:60px;font-size:30px;border-radius:12px}
      .upgrade-card h3{font-size:18px}
      .upgrade-card p{font-size:12px;min-height:0}
    }
    @media (max-width: 450px){
      .hud-right { min-width: 120px; padding: 4px 8px; }
      .hud-bar { height: 8px; }
      .hud-bar-label { font-size: 8px; }
      .hud-center .door-info { font-size: 13px; }
      .pause-button { padding: 2px 6px; font-size: 9px; }
      .arena-caption{font-size:10px}
    }
    @keyframes fade-in{from{opacity:0}to{opacity:1}}
    @keyframes card-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
    @keyframes art-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes art-glow{0%,100%{filter:drop-shadow(0 5px 8px rgba(0,0,0,.5))}50%{filter:drop-shadow(0 0 12px color-mix(in srgb,var(--card-accent) 65%,transparent))}}

    /* ===================== Online / Menu UI ===================== */
    .menu-shell{min-height:100vh;display:grid;place-items:center;padding:20px;
      background:radial-gradient(circle at 50% -10%, rgba(37,57,94,.28), transparent 43%),linear-gradient(155deg,#0a0d1d 0%,#11162b 57%,#0b1020 100%);}
    .menu-card{width:min(480px,100%);background:#121a31;border:1px solid #465276;box-shadow:0 25px 100px rgba(0,0,0,.5),9px 9px 0 #0a0e1d;padding:clamp(24px,6vw,44px);text-align:center;}
    .menu-card h1{color:#f7e8b0;font-size:clamp(34px,7vw,52px);margin:10px 0 6px;letter-spacing:-.03em;text-shadow:4px 4px 0 #293454}
    .menu-card h1 span{color:#f77961}
    .menu-sub{color:#9da9c7;font-size:14px;margin-bottom:26px;line-height:1.7}
    .menu-btn{display:block;width:100%;border:0;cursor:pointer;font-family:var(--app-font-sans);font-weight:700;font-size:16px;padding:15px 20px;margin-bottom:12px;border-radius:10px;transition:transform .14s ease,filter .14s ease;text-align:center;}
    .menu-btn:hover{transform:translate(-2px,-2px);filter:brightness(1.06)}
    .menu-btn:active{transform:translate(1px,1px)}

  function pickUpgrades(currentDoor){
    const available=upgradePool.filter(c=>c.unlockDoor<=currentDoor);
    const selected=[],pool=[...available];
    while(selected.length<3&&pool.length){
      const total = pool.reduce((sum, card) => sum + (card.weight || 50), 0);
      if (total === 0) break;
      let r = Math.random() * total;
      let chosen = pool[pool.length-1];
      for(const card of pool){
        r -= (card.weight || 50);
        if(r <= 0){ chosen = card; break; }
      }
      selected.push(chosen);
      pool.splice(pool.indexOf(chosen), 1);
    }
    return selected;
  }

        rotation:Math.random()*Math.PI,color:`hsl(${28+Math.random()*18},${18+Math.random()*14}%,${22+Math.random()*16}%)`
      });

    for(let i=0;i<32;i++){
      items.push({
        type:'patch',x:Math.random()*w,y:Math.random()*h,size:10+Math.random()*22,

    return items;

  function clampToBorder(obj, margin = BORDER_MARGIN) {
    obj.x = Math.max(margin, Math.min(WORLD_W - margin, obj.x));
    obj.y = Math.max(margin, Math.min(WORLD_H - margin, obj.y));
  }

  function mixWhite(hex,t){
    const n=parseInt(hex.slice(1),16);
    const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    return `rgb(${Math.round(r+(255-r)*t)},${Math.round(g+(255-g)*t)},${Math.round(b+(255-b)*t)})`;
  }

  function buildChips(p){
    const chips=[
      {name:'Damage',value:(Number.isInteger(p.damage)?String(p.damage):p.damage.toFixed(1))},
      {name:'Attacks',value:`${Math.round(60/p.fireRate)} / min`},
      {name:'Range',value:String(p.range)},
      {name:'Vision',value:String(p.viewDist)}
    ];
    if(p.shots>1)chips.push({name:'Weapon',value:`${p.weaponName} ×${p.shots}`});
    if(p.critChance>.08)chips.push({name:'Crit',value:`${Math.round(p.critChance*100)}%`});
    if(p.armor>0)chips.push({name:'Armor',value:`+${p.armor}`});
    if(p.orbit>0)chips.push({name:'Orbit',value:String(p.orbit)});
    if(p.magnet>75)chips.push({name:'Magnet',value:`+${Math.round((p.magnet/75-1)*100)}%`});
    if(p.regen>0)chips.push({name:'Regen',value:`+${p.regen.toFixed(1)}/s`});
    if(p.lifesteal>0)chips.push({name:'Lifesteal',value:`${Math.round(p.lifesteal*100)}%`});
    if(p.dodge>0)chips.push({name:'Dodge',value:`${Math.round(p.dodge*100)}%`});
    if(p.pierce>0)chips.push({name:'Pierce',value:`+${p.pierce}`});
    if(p.splash>0)chips.push({name:'Splash',value:`${Math.round(p.splash*100)}%`});
    if(p.xpBonus>1) chips.push({name:'⭐ XP',value:`+${Math.round((p.xpBonus-1)*100)}%`});
    if(p.slowChance>0) chips.push({name:'Slow',value:`${Math.round(p.slowPercent*100)}%`});
    if(p.chainChance>0) chips.push({name:'Chain',value:`${Math.round(p.chainChance*100)}%`});
    if(p.poisonDamage>0) chips.push({name:'Poison',value:`+${p.poisonDamage}/s`});
    if(p.freezeChance>0) chips.push({name:'Freeze',value:`${Math.round(p.freezeChance*100)}%`});
    if(p.bleedMultiplier>0) chips.push({name:'Bleed',value:`${Math.round(p.bleedMultiplier*100)}%`});
    if(p.lightningDamage>0) chips.push({name:'Lightning',value:`${p.lightningDamage} dmg`});
    return chips;

      viewDist:DEFAULT_VIEW_DIST,
      scarfAngle:0,
      slowChance:0, slowDuration:0, slowPercent:0,
      chainChance:0, poisonDamage:0, poisonDuration:0,
      freezeChance:0, bleedMultiplier:0, lightningDamage:0, lightningCooldown:0, lightningTimer:0,
    };
    return {
      player,enemies:[],projectiles:[],enemyProjectiles:[],shards:[],chests:[],
      particles:[],damageNumbers:[],decorations:generateDecorations(WORLD_W,WORLD_H),
      door:1,doorKills:0,totalKills:0,doorGoal:0,doorStarted:false,doorCleared:false,paused:false,
      spawnClock:0,elapsed:0,id:1,lastHud:0,awaitingUpgrade:false,
      bossAttacks:{},
      bossWarnings:[]
    };
  }

  function spawnEnemy(engine,boss=false,typeOverride=null,countsTowardGoal=true){
    const margin = BORDER_MARGIN + 10;
    const edge=Math.floor(Math.random()*4);
    let x,y;
    if(edge===0){x=randomBetween(margin,WORLD_W-margin);y=margin}
    else if(edge===1){x=WORLD_W-margin;y=randomBetween(margin,WORLD_H-margin)}
    else if(edge===2){x=randomBetween(margin,WORLD_W-margin);y=WORLD_H-margin}
    else{x=margin;y=randomBetween(margin,WORLD_H-margin)}

    const scale=1+(engine.door-1)*.06;
    const roll=Math.random();
    let type=typeOverride || (boss?'boss':engine.door>=6&&roll<.12?'splitter':engine.door>=5&&roll<.25?'assassin':engine.door>=4&&roll<.39?'brute':engine.door>=3&&roll<.53?'tank':engine.door>=2&&roll<.69?'shooter':engine.door>=2&&roll<.82?'charger':'grunt');
    let bossType='monarch';
    if(boss){ 
      bossType = engine.door % 20 === 0 ? 'butcher' : 'monarch';
    }
    const baseHp=(25+engine.door*3)*scale;
    
    let hp;
    let size;
    let speed;
    let damage;
    
    if (boss) {
      const bossScale = 1 + (engine.door - 1) * 0.12;
      hp = (400 + 50 * engine.door) * bossScale;
      size = 31;
      speed = 30 + engine.door * 0.4;
      damage = 18 + engine.door * 0.5;
    } else {
      hp = type==='brute'?baseHp*2.8:type==='tank'?baseHp*2.2:type==='splitter'?baseHp*1.55:type==='assassin'?baseHp*.62:type==='charger'?baseHp*.8:type==='shooter'?baseHp*.7:baseHp;
      size = type==='brute'?22:type==='tank'?19:type==='splitter'?17:type==='assassin'?11:type==='charger'?13:type==='shooter'?12:Math.floor(randomBetween(10,15));
      speed = type==='brute'?19:type==='tank'?24:type==='splitter'?28:type==='assassin'?68:type==='charger'?55:type==='shooter'?30:32;
      damage = type==='brute'?13+engine.door*.55:type==='tank'?11+engine.door*.5:type==='splitter'?9+engine.door*.4:type==='assassin'?7+engine.door*.5:type==='charger'?8+engine.door*.4:type==='shooter'?5+engine.door*.3:6+engine.door*.4;
    }

    const enemyObj={
      id:engine.id++,x,y,hp,maxHp:hp,speed,size,damage,
      color:boss?(bossType==='monarch'?'#d43b7a':'#c0392b'):type==='brute'?'#8b5a45':type==='tank'?'#8f76a9':type==='splitter'?'#6d9b69':type==='assassin'?'#8e5aa8':type==='charger'?'#d38b53':type==='shooter'?'#5f9b9d':(Math.random()>.5?'#bc6a69':'#6878a9'),
      boss,type,hitClock:type==='shooter'?1.1:boss?1.7:0,
      abilityClock:type==='splitter'?4.5:type==='assassin'?2.8:type==='grunt'?5.5:type==='minion'?5.5:type==='tank'?4.8:type==='brute'?4.2:0,
      phase:0,
      flash:0,facing:Math.random()*Math.PI*2,knockX:0,knockY:0,squish:0,bobPhase:Math.random()*Math.PI*2,
      bossType: boss?bossType:null,
      slowTimer:0, slowPercent:0,
      poisonTimer:0, frozen:false, bleedTimer:0, bleedDamage:0,
      enrageTimer:0, enrageMultiplier:1, shieldTimer:0, shieldStrength:0,
      skillFlash:0, skillTimer:0, skillResolved:false,
    };
    clampToBorder(enemyObj);
    engine.enemies.push(enemyObj);
    if (engine.doorStarted && countsTowardGoal) {
      engine.doorGoal++;
    }
    if(boss){
      engine.bossAttacks[enemyObj.id] = {
        cooldown: 1.5,
        phase: 0,
        warning: false,
        warningTimer: 0,
        attackActive: false,
        chargeDir: 0,
        aoeList: [],
        ringCount: 0,
        laserAngle: 0,
        spawnCount: 0,
        type: bossType,
        isFinished: true,
        kind: null,
        timer: 0,
        hitPlayer: false,
        zones: [],
      };
    }
    return enemyObj;
  }

  function startDoor(engine){
    engine.doorStarted=true;
    engine.doorCleared=false;
    engine.doorKills=0;
    engine.doorGoal=0;
    engine.chests=[];
    const boss=engine.door%10===0;
    if(boss){
      spawnEnemy(engine,true);
    }
    const supporting=boss?3:Math.min(5,2+Math.floor(engine.door/4));
    for(let i=0;i<supporting;i++)spawnEnemy(engine);
    if(engine.door%3===0){
      engine.chests.push({id:engine.id++,x:randomBetween(80,WORLD_W-80),y:randomBetween(80,WORLD_H-80),opened:false});
    }
    engine.spawnClock=Math.max(1.2,2.5-engine.door*.01);
  }

  function pointToSegmentDistance(px,py,ax,ay,bx,by){
    const dx=bx-ax,dy=by-ay;
    const t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1)));
    return distance(px,py,ax+dx*t,ay+dy*t);
  }

  // --- BOSS ATTACK HELPERS WITH CLEAR WARNINGS ---
  function beginBossAttack(engine,enemy,kind,warningTime,notify,message){
    const attack=engine.bossAttacks[enemy.id];
    if(!enemy.boss||!attack||!attack.isFinished) return false;
    attack.isFinished=false; attack.warning=true; attack.attackActive=false;
    attack.warningTimer=warningTime; attack.timer=warningTime; attack.kind=kind;
    attack.phase=0; attack.hitPlayer=false; attack.zones=[];
    if(notify&&message) notify(message);
    return true;
  }
  function finishBossAttack(attack,min,max){
    attack.warning=false; attack.attackActive=false; attack.isFinished=true;
    attack.phase=0; attack.kind=null; attack.zones=[];
    attack.cooldown=min+Math.random()*(max-min);
  }

  function bossChargeAttack(engine,enemy,delta,announce){
    const p=engine.player;
    if(beginBossAttack(engine,enemy,'charge',1.0,announce,'⚠️ Boss charges!')){
      const attack=engine.bossAttacks[enemy.id];
      attack.chargeDir=Math.atan2(p.y-enemy.y,p.x-enemy.x);
      engine.bossWarnings.push({
        sourceId:enemy.id,
        x:enemy.x,
        y:enemy.y,
        angle:attack.chargeDir,
        life:1.4,
        type:'charge',
        length:280,
        progress:0
      });
    }
  }

  function bossAOEAttack(engine,enemy,delta,announce){
    const p=engine.player;
    if(beginBossAttack(engine,enemy,'aoe',1.0,announce,'⚠️ Boss prepares explosion!')){
      const attack=engine.bossAttacks[enemy.id];
      const zones=[];
      for(let i=0;i<3;i++){
        const a=Math.random()*Math.PI*2, d=55+Math.random()*105;
        const zx=Math.max(BORDER_MARGIN,Math.min(WORLD_W-BORDER_MARGIN,p.x+Math.cos(a)*d));
        const zy=Math.max(BORDER_MARGIN,Math.min(WORLD_H-BORDER_MARGIN,p.y+Math.sin(a)*d));
        zones.push({x:zx,y:zy,remaining:1.2,detonated:false});
        engine.bossWarnings.push({
          sourceId:enemy.id,
          x:zx,
          y:zy,
          radius:10,
          maxRadius:65,
          life:1.4,
          type:'aoe_zone',
          progress:0
        });
      }
      attack.zones=zones;
      attack.timer=1.2;
      attack.phase=1.2;
    }
  }

  function bossRingAttack(engine,enemy,delta,announce){
    beginBossAttack(engine,enemy,'ring',0.8,announce,'🌀 Boss unleashes rings!');
    engine.bossWarnings.push({
      sourceId:enemy.id,
      x:enemy.x,
      y:enemy.y,
      life:1.2,
      type:'ring',
      maxRadius:160,
      progress:0
    });
  }

  function bossLaserAttack(engine,enemy,delta,announce){
    const p=engine.player;
    if(beginBossAttack(engine,enemy,'laser',0.9,announce,'🔴 Boss charges laser!')){
      const attack=engine.bossAttacks[enemy.id];
      attack.laserAngle=Math.atan2(p.y-enemy.y,p.x-enemy.x);
      engine.bossWarnings.push({
        sourceId:enemy.id,
        x:enemy.x,
        y:enemy.y,
        angle:attack.laserAngle,
        life:1.2,
        type:'laser',
        length:400,
        progress:0
      });
    }
  }

  function bossSpawnMinions(engine,enemy,delta,announce){
    beginBossAttack(engine,enemy,'minions',0.8,announce,'👾 Boss summons minions!');
    engine.bossWarnings.push({
      sourceId:enemy.id,
      x:enemy.x,
      y:enemy.y,
      life:0.9,
      type:'minions',
      radius:40,
      progress:0
    });
  }

  function updateBossAttack(engine,enemy,delta){
    if(!enemy.boss) return;
    const attack=engine.bossAttacks[enemy.id];
    if(!attack||attack.isFinished) return;
    const p=engine.player;

    // Update warning progress
    for(const w of engine.bossWarnings){
      if(w.sourceId===enemy.id){
        w.progress = 1 - (attack.timer / (attack.warningTimer || 1));
      }
    }

    if(attack.warning){
      attack.timer-=delta;
      if(attack.timer>0) return;
      attack.warning=false; attack.attackActive=true;
      if(attack.kind==='charge'){ attack.timer=.45; attack.phase=.45; }
      else if(attack.kind==='aoe'){ attack.timer=1.2; attack.phase=1.2; }
      else if(attack.kind==='ring'){ attack.timer=.5; attack.phase=.5; }
      else if(attack.kind==='laser'){ attack.timer=.5; attack.phase=.5; }
      else if(attack.kind==='minions'){ attack.timer=.6; attack.phase=.6; }
    }

    if(!attack.attackActive) return;
    attack.timer-=delta;

    if(attack.kind==='charge'){
      const dx=Math.cos(attack.chargeDir),dy=Math.sin(attack.chargeDir);
      enemy.x+=dx*620*delta; enemy.y+=dy*620*delta; clampToBorder(enemy);
      if(!attack.hitPlayer&&distance(enemy.x,enemy.y,p.x,p.y)<enemy.size+14){
        attack.hitPlayer=true; damagePlayer(engine,enemy.damage*1.4);
      }
      const w=engine.bossWarnings.find(w=>w.sourceId===enemy.id&&w.type==='charge');
      if(w){ w.x=enemy.x; w.y=enemy.y; w.angle=attack.chargeDir; w.life=0.5; }
    }
    else if(attack.kind==='aoe'){
      for(const zone of attack.zones){
        zone.remaining-=delta;
        const w=engine.bossWarnings.find(w=>
          w.sourceId===enemy.id&&w.type==='aoe_zone'&&
          Math.abs(w.x-zone.x)<1&&Math.abs(w.y-zone.y)<1
        );
        if(w){
          const prog=1-(zone.remaining/1.2);
          w.radius=10+prog*55;
          w.progress=prog;
        }
        if(!zone.detonated&&zone.remaining<=0){
          zone.detonated=true;
          for(let j=engine.enemies.length-1;j>=0;j--){
            const e=engine.enemies[j];
            if(!e.boss&&!e.dead&&distance(zone.x,zone.y,e.x,e.y)<65&&damageEnemy(engine,e,25,zone.x,zone.y,false,{noChain:true})){
              engine.enemies.splice(j,1);
            }
          }
          if(distance(zone.x,zone.y,p.x,p.y)<65) damagePlayer(engine,15);
          addSplashEffect(engine,zone.x,zone.y,'#ff8800',15);
          const idx=engine.bossWarnings.findIndex(w=>
            w.sourceId===enemy.id&&w.type==='aoe_zone'&&
            Math.abs(w.x-zone.x)<1&&Math.abs(w.y-zone.y)<1
          );
          if(idx!==-1) engine.bossWarnings.splice(idx,1);
        }
      }
    }
    else if(attack.kind==='ring'){
      if(attack.timer<=0){
        for(let r=0;r<2;r++) for(let i=0;i<12;i++){
          const a=Math.PI*2*i/12+Math.PI*r+engine.elapsed*.6, speed=140+Math.random()*30;
          engine.enemyProjectiles.push({x:enemy.x,y:enemy.y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:2.5,damage:enemy.damage*.45,size:5,color:'#ff8844'});
        }
        finishBossAttack(attack,2.5,3.5);
        const idx=engine.bossWarnings.findIndex(w=>w.sourceId===enemy.id&&w.type==='ring');
        if(idx!==-1) engine.bossWarnings.splice(idx,1);
      }
      const w=engine.bossWarnings.find(w=>w.sourceId===enemy.id&&w.type==='ring');
      if(w){
        w.maxRadius=70+(1-attack.timer/0.5)*90;
        w.progress=1-attack.timer/0.5;
      }
    }
    else if(attack.kind==='laser'){
      const length=430,bx=enemy.x+Math.cos(attack.laserAngle)*length,by=enemy.y+Math.sin(attack.laserAngle)*length;
      if(pointToSegmentDistance(p.x,p.y,enemy.x,enemy.y,bx,by)<18) damagePlayer(engine,8*delta*30);
      const w=engine.bossWarnings.find(w=>w.sourceId===enemy.id&&w.type==='laser');
      if(w){ w.angle=attack.laserAngle; w.length=length; w.progress=1-attack.timer/0.5; w.life=0.3; }
      if(Math.random()<0.3){
        for(let i=0;i<3;i++){
          const t=Math.random();
          const lx=enemy.x+Math.cos(attack.laserAngle)*length*t;
          const ly=enemy.y+Math.sin(attack.laserAngle)*length*t;
          engine.particles.push({
            x:lx+randomBetween(-4,4), y:ly+randomBetween(-4,4),
            vx:randomBetween(-10,10), vy:randomBetween(-10,10),
            life:0.2, maxLife:0.2, color:'#ff8844', size:3+Math.random()*4
          });
        }
      }
      if(attack.timer<=0){
        finishBossAttack(attack,2.5,3.5);
        const idx=engine.bossWarnings.findIndex(w=>w.sourceId===enemy.id&&w.type==='laser');
        if(idx!==-1) engine.bossWarnings.splice(idx,1);
      }
    }
    else if(attack.kind==='minions'){
      if(attack.timer<=0){
        for(let i=0;i<3;i++){
          const a=Math.random()*Math.PI*2,d=60+Math.random()*80;
          const minion=spawnEnemy(engine,false,'grunt');
          minion.x=Math.max(BORDER_MARGIN,Math.min(WORLD_W-BORDER_MARGIN,enemy.x+Math.cos(a)*d));
          minion.y=Math.max(BORDER_MARGIN,Math.min(WORLD_H-BORDER_MARGIN,enemy.y+Math.sin(a)*d));
          minion.size=9;minion.hp=25;minion.maxHp=25;minion.damage=6;minion.speed=55;
          minion.color='#b87333';minion.type='minion';minion.boss=false;minion.bossType=null;
        }
        finishBossAttack(attack,3.0,4.0);
        const idx=engine.bossWarnings.findIndex(w=>w.sourceId===enemy.id&&w.type==='minions');
        if(idx!==-1) engine.bossWarnings.splice(idx,1);
        addBurst(engine,enemy.x,enemy.y,'#b87333',8);
      }
    }
  }

  // ========== EFFECTS ==========
  function addSplashEffect(engine, x, y, color, count=20) {
    for(let i=0;i<count;i++){ const angle=Math.random()*Math.PI*2; const speed=Math.random()*120+40; engine.particles.push({ x, y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed, life:0.4+Math.random()*0.3, maxLife:0.7, color: color, size:4+Math.random()*6, chunky: true, rotation: Math.random()*Math.PI*2, spin: (Math.random()-0.5)*10, gravity: 50, }); }
    for(let i=0;i<6;i++){ const angle=Math.random()*Math.PI*2; const speed=Math.random()*60+20; engine.particles.push({ x, y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed, life:0.15+Math.random()*0.1, maxLife:0.25, color:'#ffffff', size:3+Math.random()*5, }); }
    for(let r=0; r<2; r++){ const radius = 20 + r*15; for(let a=0; a<Math.PI*2; a+=0.15){ const px = x + Math.cos(a)*radius; const py = y + Math.sin(a)*radius; engine.particles.push({ x: px, y: py, vx: Math.cos(a)*40, vy: Math.sin(a)*40, life: 0.3, maxLife: 0.3, color: '#ffaa44', size: 2, }); } }
  }

  function addBurst(engine,x,y,color,count=5){ for(let i=0;i<count;i++){ const angle=(Math.PI*2*i)/count+Math.random()*.35; engine.particles.push({ x,y, vx:Math.cos(angle)*randomBetween(25,75), vy:Math.sin(angle)*randomBetween(25,75), life:randomBetween(.18,.42), maxLife:.42, color, size:randomBetween(2,5) }); } }
  function addDamageNumber(engine,x,y,amount,isCrit=false){ engine.damageNumbers.push({x,y,amount,life:.55,maxLife:.55,drift:randomBetween(-8,8),isCrit}); }
  function addDebris(engine,x,y,color,count){ for(let i=0;i<count;i++){ const angle=Math.random()*Math.PI*2; engine.particles.push({ x,y, vx:Math.cos(angle)*randomBetween(25,80), vy:Math.sin(angle)*randomBetween(25,80)-30, life:randomBetween(.35,.65), maxLife:.65, color, size:randomBetween(3,5), rotation:Math.random()*Math.PI*2, spin:randomBetween(-5,5), gravity:190, chunky:true }); } }
  function xpValueForLevel(level,enemy){ const base=enemy.boss?10:(enemy.size>20?6:4); return Math.max(1,Math.round(base*(1+(level-1)*.22))); }
  function registerEnemyKill(engine,enemy){
    if(enemy.dead) return false;
    enemy.dead=true; engine.doorKills++; engine.totalKills++;
    const drops=enemy.boss?7:(enemy.type==='brute'?3:(enemy.size>20?2:1));
    for(let d=0;d<drops;d++) engine.shards.push({id:engine.id++,x:enemy.x+randomBetween(-10,10),y:enemy.y+randomBetween(-10,10),value:xpValueForLevel(engine.player.level,enemy),bob:Math.random()*Math.PI*2,rotation:Math.random()*Math.PI*2});
    addDebris(engine,enemy.x,enemy.y,enemy.color,enemy.boss?10:(enemy.size>20?6:3));
    addBurst(engine,enemy.x,enemy.y,enemy.boss?'#f77961':'#e8d9b8',enemy.boss?8:4);
    return true;
  }
  function damagePlayer(engine,amount){
    const p=engine.player; if(p.invulnerable>0||p.hp<=0) return false;
    if(Math.random()<p.dodge){ addBurst(engine,p.x,p.y,'#8fb7f0',3); return false; }
    p.hp=Math.max(0,p.hp-Math.max(1,amount-p.armor)); p.invulnerable=.38; addBurst(engine,p.x,p.y,'#f06c5c',4); return true;
  }
  function damageEnemy(engine,enemy,amount,sourceX,sourceY,isCrit=false,opts={}){
    if(!enemy || enemy.dead || enemy.hp<=0) return true;
    const rawAmount=Math.max(0,Number(amount)||0);
    const safeAmount=enemy.shieldTimer>0?rawAmount*(1-(enemy.shieldStrength||.5)):rawAmount;
    enemy.hp-=safeAmount;
    enemy.flash=.1;
    enemy.squish=1;
    if(!opts.skipKnockback && sourceX!==undefined && sourceY!==undefined){
      const a=Math.atan2(enemy.y-sourceY,enemy.x-sourceX);
      const k=enemy.boss?12:enemy.type==='tank'?20:55;
      enemy.knockX+=Math.cos(a)*k;
      enemy.knockY+=Math.sin(a)*k;
    }
    if(opts.showNumber!==false && safeAmount>0){
      addDamageNumber(engine,enemy.x,enemy.y-enemy.size-4,safeAmount,isCrit);
    }

    const p=engine.player;
    if(!opts.skipEffects){
      if(p.slowChance>0 && p.slowDuration>0 && Math.random()<p.slowChance){
        enemy.slowTimer=Math.max(enemy.slowTimer||0,p.slowDuration);
        enemy.slowPercent=Math.max(enemy.slowPercent||0,p.slowPercent||0);
        addBurst(engine,enemy.x,enemy.y,'#88ccff',4);
      }
      if(p.freezeChance>0 && Math.random()<p.freezeChance){
        enemy.frozen=true;
        enemy.slowTimer=0;
        addBurst(engine,enemy.x,enemy.y,'#aaddff',8);
        setTimeout(()=>{enemy.frozen=false;},1000);
      }
      if(p.poisonDamage>0 && p.poisonDuration>0){
        enemy.poisonTimer=Math.max(enemy.poisonTimer||0,p.poisonDuration);
        addBurst(engine,enemy.x,enemy.y,'#77ff77',3);
      }
      if(p.bleedMultiplier>0 && isCrit){
        const bleedDmg=safeAmount*p.bleedMultiplier;
        enemy.bleedTimer=Math.max(enemy.bleedTimer||0,3);
        enemy.bleedDamage=Math.max(enemy.bleedDamage||0,bleedDmg/3);
        addBurst(engine,enemy.x,enemy.y,'#ff3333',5);
      }
      if(p.chainChance>0 && !opts.noChain && Math.random()<p.chainChance){
        let nearest=null; let nearestDist=120;
        for(const other of engine.enemies){
          if(other===enemy || other.dead) continue;
          const d=distance(enemy.x,enemy.y,other.x,other.y);
          if(d<nearestDist){nearestDist=d;nearest=other;}
        }
        if(nearest){
          damageEnemy(engine,nearest,Math.max(1,p.damage*.45),enemy.x,enemy.y,false,{noChain:true});
          addBurst(engine,nearest.x,nearest.y,'#ffee88',5);
          for(let i=0;i<6;i++){
            const t=i/6;
            engine.particles.push({x:enemy.x+(nearest.x-enemy.x)*t+randomBetween(-4,4),y:enemy.y+(nearest.y-enemy.y)*t+randomBetween(-4,4),vx:randomBetween(-5,5),vy:randomBetween(-5,5),life:.2,maxLife:.2,color:'#ffff88',size:2});
          }
        }
      }
    }
    if(enemy.hp<=0){
      registerEnemyKill(engine,enemy);
      return true;
    }
    return false;
  }

  function updateEnemySkill(engine, enemy, delta, gap) {
    if (enemy.type === 'grunt' || enemy.type === 'minion') {
      enemy.abilityClock -= delta;
      if (enemy.abilityClock <= 0) {
        enemy.abilityClock = 5.8;
        enemy.skillFlash = .35;
        for (const ally of engine.enemies) {
          if (ally !== enemy && !ally.dead && !ally.boss && distance(enemy.x, enemy.y, ally.x, ally.y) < 210) {

    }
    else if (enemy.type === 'tank') {
      enemy.abilityClock -= delta;

        enemy.abilityClock = 5.2;

        enemy.shieldStrength = .55;

          if (distance(enemy.x, enemy.y, engine.player.x, engine.player.y) < 100) damagePlayer(engine, enemy.damage * 1.35);
          addSplashEffect(engine, enemy.x, enemy.y, '#d68b55', 10);
        }

    }
  }

  function drawGround(ctx,engine,camX,camY,canvasW,canvasH){
    const grad=ctx.createLinearGradient(0,0,0,canvasH);
    grad.addColorStop(0,'#2e2620');grad.addColorStop(.45,'#241d18');grad.addColorStop(.8,'#1b1512');grad.addColorStop(1,'#13100d');
    ctx.fillStyle=grad;ctx.fillRect(0,0,canvasW,canvasH);
    const tileSize=46;
    const startCol=Math.floor(camX/tileSize),startRow=Math.floor(camY/tileSize);
    const cols=Math.ceil(canvasW/tileSize)+2,rows=Math.ceil(canvasH/tileSize)+2;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const col=startCol+c,row=startRow+r;
        const tx=col*tileSize-camX,ty=row*tileSize-camY;
        ctx.fillStyle=(col+row)%2===0?'rgba(60,49,40,.35)':'rgba(38,31,26,.35)';
        ctx.fillRect(tx,ty,tileSize,tileSize);
      }
    }
    ctx.strokeStyle='rgba(10,8,6,.4)';ctx.lineWidth=1;
    const startX=-(camX%tileSize),startY=-(camY%tileSize);
    for(let x=startX;x<canvasW;x+=tileSize){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvasH);ctx.stroke()}
    for(let y=startY;y<canvasH;y+=tileSize){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvasW,y);ctx.stroke()}
    for(const dec of engine.decorations){
      const dx=dec.x-camX,dy=dec.y-camY;
      if(dx<-30||dx>canvasW+30||dy<-30||dy>canvasH+30)continue;
      if(dec.type==='pebble'){
        ctx.fillStyle=dec.color;ctx.fillRect(Math.round(dx-dec.size/2),Math.round(dy-dec.size/2),Math.round(dec.size),Math.round(dec.size));
      }else if(dec.type==='patch'){
        ctx.save();ctx.translate(dx,dy);ctx.rotate(dec.rotation);ctx.fillStyle=dec.color;ctx.fillRect(-dec.size/2,-dec.size/3,dec.size,dec.size*.66);ctx.restore();
      }else{
        ctx.save();ctx.translate(dx,dy);ctx.rotate(dec.rotation);ctx.strokeStyle=dec.color;ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(-dec.length/2,0);ctx.lineTo(dec.length/2,0);ctx.stroke();ctx.restore();
      }
    }
    const vignette=ctx.createRadialGradient(canvasW/2,canvasH/2,Math.min(canvasW,canvasH)*.35,canvasW/2,canvasH/2,Math.max(canvasW,canvasH)*.75);
    vignette.addColorStop(0,'rgba(0,0,0,0)');vignette.addColorStop(1,'rgba(0,0,0,.32)');
    ctx.fillStyle=vignette;ctx.fillRect(0,0,canvasW,canvasH);
    ctx.strokeStyle='rgba(255,50,50,0.2)';
    ctx.lineWidth=2;
    ctx.strokeRect(-camX+BORDER_MARGIN, -camY+BORDER_MARGIN, WORLD_W-BORDER_MARGIN*2, WORLD_H-BORDER_MARGIN*2);
  }

  function drawPlayer(ctx, x, y, facing, walkCycle, attackKick, aimAngle, scarfAngle, scale, range) {
    const effectiveRange = range * 0.6;
    const s = 6 * scale;
    const legSwing = Math.sin(walkCycle) * 4;
    const armSwing = Math.sin(walkCycle + 0.3) * 3.5;
    const shoulderBob = Math.sin(walkCycle) * 1.5;

    ctx.save();
    ctx.globalAlpha = 0.15;
    ctx.strokeStyle = '#f2c94c';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 6]);
    const distToLeft = x - BORDER_MARGIN;
    const distToRight = (WORLD_W - BORDER_MARGIN) - x;
    const distToTop = y - BORDER_MARGIN;
    const distToBottom = (WORLD_H - BORDER_MARGIN) - y;
    const maxRadius = Math.min(effectiveRange, distToLeft, distToRight, distToTop, distToBottom);
    if (maxRadius > 5) {
      ctx.beginPath();
      ctx.arc(x, y, maxRadius, 0, Math.PI*2);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    ctx.restore();

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(facing, 1);
    ctx.imageSmoothingEnabled = false;

    const skin = '#d4a574';
    const shirt = '#4a8bc2';
    const pants = '#2c3e50';
    const shoe = '#5d4e37';
    const scarf = '#e74c3c';
    const scarfDark = '#c0392b';

    ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(0, 14, 16, 5, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = skin;
    ctx.fillRect(-s*0.9, -s*1.9, s*1.8, s*1.8);
    ctx.fillStyle = '#1b263e';
    ctx.fillRect(-s*0.5, -s*1.4, s*0.3, s*0.3);
    ctx.fillRect(s*0.2, -s*1.4, s*0.3, s*0.3);
    ctx.fillStyle = '#8b5a3c';
    ctx.fillRect(-s*0.25, -s*0.7, s*0.5, s*0.1);

    ctx.fillStyle = shirt;
    ctx.fillRect(-s*0.8, 0, s*1.6, s*1.4);

    ctx.fillStyle = skin;
    ctx.save();
    ctx.translate(-s*1.2, 0 + shoulderBob);
    ctx.rotate(armSwing * 0.03);
    ctx.fillRect(-s*0.3, 0, s*0.5, s*1.3);
    ctx.restore();
    ctx.save();
    ctx.translate(s*1.2, 0 - shoulderBob);
    ctx.rotate(-armSwing * 0.03);
    ctx.fillRect(-s*0.2, 0, s*0.5, s*1.3);
    ctx.restore();

    ctx.fillStyle = pants;
    ctx.save();
    ctx.translate(-s*0.5, s*1.4);
    ctx.rotate(legSwing * 0.03);
    ctx.fillRect(-s*0.3, 0, s*0.5, s*0.8);
    ctx.restore();
    ctx.save();
    ctx.translate(s*0.5, s*1.4);
    ctx.rotate(-legSwing * 0.03);
    ctx.fillRect(-s*0.2, 0, s*0.5, s*0.8);
    ctx.restore();
    ctx.fillStyle = shoe;
    ctx.save();
    ctx.translate(-s*0.5, s*2.2 + legSwing*0.3);
    ctx.fillRect(-s*0.3, 0, s*0.5, s*0.25);
    ctx.restore();
    ctx.save();
    ctx.translate(s*0.5, s*2.2 - legSwing*0.3);
    ctx.fillRect(-s*0.2, 0, s*0.5, s*0.25);
    ctx.restore();

    const scarfWave = Math.sin(scarfAngle) * 0.3;
    ctx.save();
    ctx.translate(-s*0.4, -s*0.3);
    ctx.rotate(scarfWave * facing);
    ctx.fillStyle = scarf;
    ctx.fillRect(-s*0.15, 0, s*0.4, s*1.5);
    ctx.fillStyle = scarfDark;
    ctx.fillRect(0, s*0.5, s*0.25, s*1.0);
    ctx.restore();

    const aim = aimAngle || 0;
    const weaponAngle = facing === 1 ? aim : Math.PI - aim;
    const kick = attackKick * 4;
    ctx.save();
    ctx.translate(s*1.0, -s*0.1);
    ctx.rotate(weaponAngle);
    ctx.strokeStyle = '#8b6b4d';
    ctx.lineWidth = s*0.25;
    ctx.beginPath();
    ctx.arc(0, 0, s*1.4, -0.8, 0.8);
    ctx.stroke();
    ctx.strokeStyle = '#a08060';
    ctx.lineWidth = s*0.1;
    ctx.beginPath();
    ctx.arc(0, 0, s*1.2, -0.7, 0.7);
    ctx.stroke();
    ctx.strokeStyle = '#c9b99a';
    ctx.lineWidth = s*0.12;
    ctx.beginPath();
    ctx.moveTo(s*0.9, -s*0.9);
    ctx.lineTo(s*0.9, s*0.9);
    ctx.stroke();
    if (attackKick > 0.2) {
      ctx.fillStyle = '#7a5230';
      ctx.fillRect(s*0.9 + kick, -s*0.1, s*1.0, s*0.2);
      ctx.fillStyle = '#c0392b';
      ctx.beginPath();
      ctx.moveTo(s*1.9 + kick, -s*0.25);
      ctx.lineTo(s*2.3 + kick, 0);
      ctx.lineTo(s*1.9 + kick, s*0.25);
      ctx.fill();
      ctx.fillStyle = '#e8d5b0';
      ctx.fillRect(s*0.9 + kick, -s*0.2, s*0.2, s*0.08);
      ctx.fillRect(s*0.9 + kick, s*0.12, s*0.2, s*0.08);
    }
    ctx.restore();

    ctx.restore();
  }

  function drawBossWarnings(ctx, engine, camX, camY, canvasW, canvasH) {
    for (const warn of engine.bossWarnings) {
      const dx = warn.x - camX, dy = warn.y - camY;
      if (dx < -300 || dx > canvasW + 300 || dy < -300 || dy > canvasH + 300) continue;
      ctx.save();
      const alpha = Math.min(1, warn.life * 2);
      ctx.globalAlpha = alpha;

      if (warn.type === 'charge') {
        const progress = Math.min(1, warn.progress || 0);
        const length = (warn.length || 280) * (0.3 + progress * 0.7);
        const ex = dx + Math.cos(warn.angle) * length;
        const ey = dy + Math.sin(warn.angle) * length;
        ctx.shadowColor = '#ff3300';
        ctx.shadowBlur = 25;
        ctx.strokeStyle = `rgba(255, 60, 30, ${0.6 + progress * 0.4})`;
        ctx.lineWidth = 6 - progress * 3;
        ctx.setLineDash([10 + progress * 8, 8]);

        for(let i=engine.bossWarnings.length-1;i>=0;i--){
          const w=engine.bossWarnings[i];
          w.life-=delta;
          if(w.life<=0) engine.bossWarnings.splice(i,1);
        }

        if(engine.doorKills>=engine.doorGoal&&engine.enemies.length===0&&!engine.doorCleared){
          engine.doorCleared=true; engine.door++; engine.doorStarted=false; engine.doorKills=0;
           engine.chests=[]; engine.projectiles=[]; engine.enemyProjectiles=[]; engine.bossWarnings=[];
          startDoor(engine);
          announce(`Door ${engine.door} opened`);
        }

        if(p.xp>=p.nextXp&&!engine.awaitingUpgrade){
          p.xp-=p.nextXp; p.level++;
          p.nextXp=Math.floor(35+Math.pow(p.level,1.35)*8);
          engine.awaitingUpgrade=true;
          const newChoices = pickUpgrades(engine.door);
          setChoices(newChoices);
          setPaused(true);
          setMode('upgrade');
          announce('New upgrade available!');
        }

        if(p.hp<=0){ setHud(readHud(engine)); setMode('gameover'); setPaused(true); setBest(old=>Math.max(old,engine.door)); announce('Game Over'); }
        if(engine.lastHud+120<performance.now()){ engine.lastHud=performance.now(); setHud(readHud(engine)); }
      };

      const draw=engine=>{
        const canvasW=canvas.width/lastCanvasRatio||canvas.clientWidth;
        const canvasH=canvas.height/lastCanvasRatio||canvas.clientHeight;
        const p=engine.player;

        const baseZoom = 0.7;
        const viewFactor = Math.min(2, p.viewDist / DEFAULT_VIEW_DIST);
        const zoomFactor = baseZoom * viewFactor;
        const viewW = canvasW * zoomFactor;
        const viewH = canvasH * zoomFactor;
        let camX = p.x - viewW/2;
        let camY = p.y - viewH/2;
        camX = Math.max(0, Math.min(WORLD_W - viewW, camX));
        camY = Math.max(0, Math.min(WORLD_H - viewH, camY));

        ctx.clearRect(0,0,canvasW,canvasH);
        ctx.save();
        ctx.translate(canvasW/2, canvasH/2);
        ctx.scale(1/zoomFactor, 1/zoomFactor);
        ctx.translate(-viewW/2, -viewH/2);

        drawGround(ctx,engine,camX,camY,viewW,viewH);
        const drawWorld=fn=>{ ctx.save(); ctx.translate(-camX,-camY); fn(); ctx.restore(); };
        drawWorld(()=>{
          for(const shard of engine.shards){
            const bob = Math.sin(shard.bob) * 2;
            const glow = 0.3 + Math.sin(shard.bob * 2) * 0.15;
            ctx.save();
            ctx.translate(Math.round(shard.x), Math.round(shard.y + bob));
            ctx.rotate(shard.rotation || 0);
            ctx.shadowColor = '#f1c40f';
            ctx.shadowBlur = 12 * glow;
            ctx.beginPath();
            ctx.moveTo(0, -6);
            ctx.lineTo(5, 0);
            ctx.lineTo(0, 6);
            ctx.lineTo(-5, 0);
            ctx.closePath();
            const grad = ctx.createLinearGradient(-5, -5, 5, 5);
            grad.addColorStop(0, '#f7dc6f');
            grad.addColorStop(0.5, '#f1c40f');
            grad.addColorStop(1, '#d4ac0d');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255, 255, 200, 0.7)';
            ctx.beginPath();
            ctx.arc(0, -1, 2, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
          }

          for(const chest of engine.chests){ ctx.save(); ctx.translate(chest.x,chest.y); ctx.fillStyle='rgba(5,8,20,.42)'; ctx.fillRect(-15,9,30,7); ctx.fillStyle=chest.opened?'#4d566e':'#9f673b'; ctx.fillRect(-14,-8,28,18); ctx.fillStyle=chest.opened?'#69738a':'#d29a45'; ctx.fillRect(-12,-12,24,8); ctx.fillStyle=chest.opened?'#3d465c':'#f2c94c'; ctx.fillRect(-3,-2,6,8); ctx.restore(); }

          for(const proj of engine.projectiles){
            const a=Math.atan2(proj.vy,proj.vx);
            ctx.save();
            ctx.translate(proj.x, proj.y);
            ctx.rotate(a);
            const s = proj.size * 0.6;
            ctx.strokeStyle = '#8b5a2b';
            ctx.lineWidth = s * 0.7;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-s * 2.2, 0);
            ctx.lineTo(s * 0.5, 0);
            ctx.stroke();
            ctx.fillStyle = '#e0e0e0';
            ctx.fillRect(-s * 1.8, -s * 0.7, s * 0.4, s * 0.25);
            ctx.fillRect(-s * 1.8, s * 0.45, s * 0.4, s * 0.25);
            ctx.fillRect(-s * 1.4, -s * 0.8, s * 0.3, s * 0.2);
            ctx.fillRect(-s * 1.4, s * 0.6, s * 0.3, s * 0.2);
            ctx.fillStyle = '#c0392b';
            ctx.beginPath();
            ctx.moveTo(s * 1.2, 0);
            ctx.lineTo(-s * 0.1, s * 0.7);
            ctx.lineTo(-s * 0.1, -s * 0.7);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#a93226';
            ctx.lineWidth = 0.5;
            ctx.stroke();
            if(proj.crit){
              ctx.fillStyle = 'rgba(255,215,0,0.3)';
              ctx.beginPath();
              ctx.arc(0, 0, s * 1.5, 0, Math.PI*2);
              ctx.fill();
            }
            ctx.restore();
          }

          for(const proj of engine.enemyProjectiles){ const a=Math.atan2(proj.vy,proj.vx)+engine.elapsed*3; ctx.save(); ctx.translate(proj.x,proj.y); ctx.rotate(a); ctx.fillStyle=proj.color||'#f06c5c'; ctx.beginPath(); ctx.moveTo(proj.size,0); ctx.lineTo(0,proj.size); ctx.lineTo(-proj.size,0); ctx.lineTo(0,-proj.size); ctx.closePath(); ctx.fill(); ctx.fillStyle='#7a2b26'; ctx.fillRect(-1,-1,2,2); ctx.restore(); }
          for(const enemy of engine.enemies) drawEnemy(ctx,enemy,engine.elapsed);
          if(p.orbit>0){ for(let k=0;k<p.orbit;k++){ const angle=engine.elapsed*2.8 + (Math.PI*2*k)/p.orbit; const ox=p.x+Math.cos(angle)*32, oy=p.y+Math.sin(angle)*32; ctx.shadowColor='#66ffbb'; ctx.shadowBlur=12; ctx.fillStyle='#66ffbb'; ctx.beginPath(); ctx.arc(ox,oy,6,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0; ctx.fillStyle='#ccffdd'; ctx.beginPath(); ctx.arc(ox,oy,3,0,Math.PI*2); ctx.fill(); } }
          drawPlayer(ctx, p.x, p.y, p.facing, p.walkCycle, p.attackKick, p.aimAngle, p.scarfAngle, 1.3, p.range);
          for(const pt of engine.particles){ const alpha=Math.max(0,pt.life/pt.maxLife); ctx.globalAlpha=alpha; ctx.fillStyle=pt.color; if(pt.chunky){ ctx.save(); ctx.translate(pt.x,pt.y); ctx.rotate(pt.rotation||0); ctx.fillRect(-pt.size/2,-pt.size/2,pt.size,pt.size); ctx.restore(); } else ctx.fillRect(pt.x-pt.size/2,pt.y-pt.size/2,pt.size,pt.size); }
          ctx.globalAlpha=1; ctx.textAlign='center'; ctx.font='700 13px "Space Mono",monospace';
          for(const dn of engine.damageNumbers){ ctx.globalAlpha=Math.max(0,dn.life/dn.maxLife); ctx.fillStyle=dn.isCrit?'#ffd84d':'#f5e6b0'; ctx.font=dn.isCrit?'800 15px "Space Mono",monospace':'700 13px "Space Mono",monospace'; const text=(Number.isInteger(dn.amount)?String(dn.amount):dn.amount.toFixed(1)); ctx.fillText(dn.isCrit?`✦ ${text}`:text,dn.x,dn.y); }
          ctx.globalAlpha=1;
        });
        ctx.restore();

        // Boss warnings
        ctx.save();
        ctx.translate(canvasW/2, canvasH/2);
        ctx.scale(1/zoomFactor, 1/zoomFactor);
        ctx.translate(-viewW/2, -viewH/2);
        drawBossWarnings(ctx, engine, camX, camY, viewW, viewH);
        ctx.restore();

        ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(0,0,canvasW,2);
        ctx.fillStyle='rgba(200,200,255,.5)'; ctx.font='10px "Space Mono",monospace'; ctx.textAlign='left';
        ctx.fillText(`Enemies: ${engine.enemies.length}`,10,canvasH-10);
      };

      updateRef.current=update; drawRef.current=draw;
      const loop=time=>{ const engine=engineRef.current; const delta=Math.min(1/30,Math.max(0,(time-prev)/1000)); prev=time; resize(); if(engine){ engine.paused=pausedRef.current||modeRef.current!=='playing'; if(!engine.paused) updateRef.current(engine,delta); drawRef.current(engine); } anim=requestAnimationFrame(loop); };
      resize(); anim=requestAnimationFrame(loop);
      return()=>cancelAnimationFrame(anim);
    }, []);

    return (
      <div className="game-shell">
        <header className="game-header">
          <div className="brand">
            <div className="brand-mark"/>
            <div className="brand-copy">
              <div className="brand-name">Block Survivor</div>
              <div className="brand-sub">Balanced + Boss Warnings</div>
            </div>
          </div>
          <div className="header-hint">Balanced with drawn cards & side effects</div>
          {onExit&&<button className="pause-button" onClick={onExit} style={{pointerEvents:'auto'}}>⟵ Menu</button>}
        </header>
        <main className="game-main">
          <div className="game-grid">
            <section className="arena-wrap">
              <div className="arena-frame">
                <canvas ref={canvasRef} className="game-canvas" width="1400" height="900" onPointerMove={onPointerMove} onPointerLeave={()=>{aimRef.current.active=false}}/>
                <div className="arena-reticle"/>
                
                {/* HUD Overlay */}
                <div className="hud-overlay">
                  <div className="hud-top">
                    <div className="hud-left">
                      <button className="pause-button" onClick={togglePause}>{paused?'Resume':'Pause'} <span>[P]</span></button>
                    </div>
                    <div className="hud-right">
                      <div className="hud-bar-label"><span>❤️ Health</span><span>{Math.ceil(hud.hp)} / {hud.maxHp}</span></div>
                      <div className="hud-bar"><div className="hud-bar-fill hp" style={{width:`${Math.max(0,Math.min(100,hud.hp/hud.maxHp*100))}%`}}/></div>
                      <div className="hud-bar-label" style={{marginTop:'2px'}}><span>⭐ XP</span><span>{hud.xp} / {hud.nextXp}</span></div>
                      <div className="hud-bar">
                        <div className="hud-bar-fill xp" style={{width:`${Math.min(100,hud.xp/hud.nextXp*100)}%`}}/>
                        <span className="xp-level-badge">Lv.{hud.level}</span>
                      </div>
                    </div>
                  </div>
                  <div className="hud-center">
                    <div className="door-info">🚪 Door {hud.door}</div>
                  </div>
                </div>

                {paused && mode==='playing' && <div className="pause-pill">Paused</div>}
              </div>
              <div className="arena-caption"><span><strong>Controls:</strong> WASD · Auto-attack</span><span><strong>Goal:</strong> Clear rooms</span></div>
            </section>
          </div>
        </main>

        {/* Mobile controls */}
        <div className="mobile-controls">
          <div className="joystick-area" ref={joystickRef}
               onTouchStart={handleJoystickStart}
               onTouchMove={handleJoystickMove}
               onTouchEnd={handleJoystickEnd}
               onTouchCancel={handleJoystickEnd}
               onMouseDown={handleJoystickStart}
               onMouseMove={handleJoystickMove}
               onMouseUp={handleJoystickEnd}
               onMouseLeave={handleJoystickEnd}
          >
            <div className="joystick-knob" ref={joystickKnobRef}></div>
          </div>
        </div>

        {mode==='title'&&(<div className="screen-overlay"><section className="title-card"><div className="eyebrow">Balanced + Boss Warnings</div><h1 className="hero-title">Block <span>Survivor</span></h1><p className="hero-copy">Clear rooms, choose upgrades, and survive boss attacks with clear warnings.</p><button className="start-button" onClick={startGame}>Start Journey</button><div className="control-legend"><span><span className="keycap">W A S D</span> Move</span><span><span className="keycap">P</span> Pause</span><span>Auto-attack</span></div></section></div>)}
        {mode==='upgrade'&&(<div className="screen-overlay"><section className="upgrade-wrap"><div className="upgrade-head"><div className="eyebrow">New Upgrade · Level {hud.level}</div><h2 className="upgrade-title">Choose your upgrade</h2><div className="upgrade-sub">Pick one card and continue clearing rooms.</div></div><div className="upgrade-cards">{choices.map((choice,idx)=>(<button className={`upgrade-card rarity-${choice.rarity}`} key={choice.id} onClick={()=>chooseUpgrade(choice)}><span className="upgrade-card-top"><span className="rarity-badge">{choice.rarityLabel}</span><span className="upgrade-index">0{idx+1}</span></span><span className="upgrade-icon" aria-hidden="true"><span className="card-art-wrap"><CardArt type={choice.id} rarity={choice.rarity}/></span></span><span className="upgrade-type">Upgrade</span><h3>{choice.name}</h3><p>{choice.description}</p><span className="card-effect"><b>Effect</b>{choice.effect}</span><span className="choose-hint">Tap to select <b>↙</b></span></button>))}</div></section></div>)}
        {mode==='gameover'&&(<div className="screen-overlay"><section className="title-card game-over-card"><div className="eyebrow">Game Over</div><h2 className="game-over-title">You lost</h2><p className="hero-copy">Change your build and try again.</p><div className="run-summary"><div><span>Last Door</span><strong>{hud.door}</strong></div><div><span>Kills</span><strong>{hud.kills}</strong></div><div><span>Level</span><strong>{hud.level}</strong></div></div><button className="restart-button" onClick={restart}>Try Again</button></section></div>)}
        {toast&&<div className="toast" role="status">{toast}</div>}
      </div>
    );
  }
